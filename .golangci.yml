run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - .venv

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - bodyclose
    - nilerr
    - revive

linters-settings:
  goimports:
    local-prefixes: github.com/animeshroy/search-and-retrieval-system
  revive:
    rules:
      - name: exported
        disabled: true
